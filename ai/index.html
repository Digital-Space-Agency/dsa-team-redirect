<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07051a">

<title>AI opportunity brief</title>
<style>
@font-face{font-family:'Avenir LT Std';src:url('https://www.digitalspaceagency.com/assets/font/subset-AvenirLTStd-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
:root{--sec:#ff706f;--pur:#a24bd8;--bg:#07051a;--text:#f2f0ff;--ink:#f2f0ff;--muted:#a9a6cf;--mut:#a9a6cf;--line:rgba(185,168,255,.18);--glass:rgba(22,16,60,.55);--lav:#b9a8ff;--bad:#ff9b9a;--ok:#7ee0b5}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:'Avenir LT Std',Avenir,'Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;font-size:16px;line-height:1.55;color:var(--text);
background:radial-gradient(900px 600px at 90% -10%,rgba(80,40,200,.38),transparent 60%),radial-gradient(700px 500px at -20% 45%,rgba(255,112,111,.13),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;padding:env(safe-area-inset-top) 18px 40px}
main{max-width:520px;margin:0 auto;padding-top:16px}
a{color:var(--sec)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:block;width:72px;height:auto}
.logo svg{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.pill{display:inline-flex;gap:8px;align-items:center;color:var(--sec);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;margin:26px 0 0;line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sec);box-shadow:0 0 10px var(--sec);flex:none}
h1{font-size:30px;line-height:1.12;margin:12px 0 10px;letter-spacing:-.01em;font-weight:700}
p.sub{margin:0 0 20px;color:var(--muted);font-size:16.5px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
label:first-child{margin-top:2px}
label small{font-weight:500;color:var(--muted)}
input[type=text],input[type=email],textarea{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(7,5,26,.55);color:var(--text);font:inherit;font-size:16px}
input::placeholder,textarea::placeholder{color:rgba(169,166,207,.6)}
input:focus,textarea:focus{outline:2px solid var(--lav);outline-offset:1px;border-color:transparent}
textarea{min-height:72px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--muted)}
.chk input{margin-top:2px;width:20px;height:20px;flex:none;accent-color:var(--sec)}
.chk label{font-weight:500}
.chk a{color:var(--sec)}
button{width:100%;margin-top:18px;padding:15px 24px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--sec),var(--pur));box-shadow:0 8px 30px rgba(255,112,111,.28);cursor:pointer;transition:transform .2s}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.55}
button.ghost{background:transparent;color:var(--text);border:2px solid var(--lav);box-shadow:none;font-weight:700}
#lang{width:auto;margin:0;padding:5px 14px;font-size:13px;border-width:1.5px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1.2em}
.banner{display:none;margin:10px 0;padding:10px 14px;border-radius:12px;background:rgba(255,112,111,.12);border:1px solid rgba(255,112,111,.4);font-size:14px}
.steps{list-style:none;margin:4px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--muted)}
.steps li .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.steps li.on{color:var(--text);font-weight:700}
.steps li.on .b{border-color:var(--lav);animation:pulse 1.2s infinite}
.steps li.ok{color:var(--text)}
.steps li.ok .b{background:linear-gradient(135deg,var(--sec),var(--pur));border-color:transparent;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(185,168,255,.22)}}
.opp{padding:14px 0;border-top:1px solid var(--line)}
.opp:first-of-type{border-top:0;padding-top:2px}
.opp h3{margin:0 0 4px;font-size:17px;line-height:1.3}
.opp p{margin:4px 0;color:var(--muted);font-size:14.5px}
.opp b{color:var(--text)}
.tags{margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:6px}.tags .tag{margin-left:0;text-transform:none;letter-spacing:.02em}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sec);border:1px solid rgba(255,112,111,.45);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.note{font-size:13.5px;color:var(--muted)}
.warn{background:rgba(255,112,111,.1);border:1px solid rgba(255,112,111,.4);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
#summary p{margin:0}
a.cta{display:block;text-align:center;text-decoration:none;margin-top:16px;padding:14px 24px;border-radius:999px;background:linear-gradient(135deg,var(--sec),var(--pur));color:#fff;font-weight:700;box-shadow:0 8px 30px rgba(255,112,111,.28)}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot a{color:var(--muted)}
.hide{display:none!important}
</style>
</head>

  <div class="pill"><span class="dot"></span><span id="t_badge"></span></div>

  <section id="v_form">
    <h1 id="t_h1"></h1>
    <p class="sub" id="t_sub"></p>
    <form class="card" id="f" novalidate autocomplete="on">
      <label for="name" id="t_name"></label>
      <input id="name" name="name" type="text" autocomplete="name" autocapitalize="words" maxlength="60" required>
      <label for="email" id="t_email"></label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" maxlength="254" required>
      <label for="website" id="t_web"></label>
      <input id="website" name="website" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" maxlength="300" placeholder="company.com" required>
      <label for="task"><span id="t_task"></span> <small id="t_opt"></small></label>
      <textarea id="task" name="task" maxlength="200" rows="2"></textarea>
      <p class="note" id="t_mic" style="margin:4px 0 0"></p>
      <input class="hp" id="hp" name="company_fax" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="chk"><input id="consent" type="checkbox"><label for="consent" style="font-weight:400;margin:0"><span id="t_consent"></span> <a id="t_priv" target="_blank" rel="noopener"></a></label></div>
      <div class="chk"><input id="contact" type="checkbox"><label for="contact" style="font-weight:400;margin:0"><span id="t_contact"></span></label></div>
      <div class="err" id="err" role="alert"></div>
      <button id="go" type="submit"></button>
    </form>
    <p class="note" id="t_local"></p>
  </section>

  <section id="v_wait" class="hide">
    <h1 id="t_wait_h"></h1>
    <p class="sub" id="t_wait_sub"></p>
    <div class="banner" id="net"></div>
    <div class="card">
      <ul class="steps" id="steps"></ul>
      <p class="note" id="queue"></p>
    </div>
  </section>

  <section id="v_done" class="hide">
    <h1 id="t_done_h"></h1>
    <div class="warn hide" id="generic"></div>
    <div class="card hide" id="redo"><b id="t_redo_h"></b><p class="note" id="t_redo_p" style="margin:6px 0 8px"></p>
      <textarea id="redo_blurb" maxlength="300"></textarea><div class="err" id="redo_err"></div><button id="redo_go" type="button"></button></div>
    <div class="card"><div id="summary"></div></div>
    <div class="card"><div id="opps"></div></div>
    <div class="card"><b id="t_quick"></b><p id="quick" style="margin:6px 0 0"></p><a class="cta" id="cta" target="_blank" rel="noopener"></a></div>
    <p class="note" id="mailnote"></p>
    <p class="note" id="aihint"></p>
    <button id="again" class="ghost" type="button"></button>
  </section>

  <section id="v_fail" class="hide">
    <h1 id="t_fail_h"></h1>
    <p class="sub" id="t_fail_p"></p>
    <button id="retry" class="ghost" type="button"></button>
  </section>
  <footer class="foot"><span>Digital Space Agency · Hamburg</span><a href="https://www.digitalspaceagency.com" target="_blank" rel="noopener">digitalspaceagency.com</a></footer>
</main>

      d_phone: 'Handy', d_laptop: 'Laptop', d_both: 'Handy + Laptop', a_on: 'On-Device-KI', a_cloud: 'Cloud-KI', a_hybrid: 'On-Device- + Cloud-KI',
      mail_sent: 'Wir haben ihn auch gesendet an ', mail_wait: 'Er ist auch auf dem Weg in Ihr Postfach.', mail_failed: 'E-Mail verzögert sich, wir versuchen es weiter. Hier steht der komplette Brief.',
      ai: 'Von KI aus öffentlichen Informationen über Ihr Unternehmen erstellt. Bitte prüfen Sie den Inhalt, bevor Sie sich darauf verlassen.', again: 'Weitere Firma ausprobieren',
      fail_h: 'Das hat nicht geklappt', fail_p: 'Bei uns ist etwas schiefgelaufen. Bitte erneut versuchen oder uns am Stand ansprechen.', retry: 'Erneut versuchen',
      e_name: 'Bitte geben Sie Ihren Namen ein.', e_email: 'Bitte prüfen Sie Ihre E-Mail-Adresse.', e_website: 'Bitte prüfen Sie die Website, zum Beispiel firma.de.', e_consent: 'Bitte stimmen Sie der Einwilligung zu.',
      e_rate: 'Zu viele Anfragen aus diesem Netz. Bitte in einer Minute erneut versuchen.', e_busy: 'Gerade ist sehr viel los. Bitte in einer Minute erneut versuchen.', e_net: 'Keine Verbindung. Neuer Versuch…', e_generic: 'Senden fehlgeschlagen. Bitte erneut versuchen.',
    },
  };
  var lang = (function () { try { var s = localStorage.getItem('dsa_lang'); if (s) return s; } catch (e) {} return (navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en'; })();
  var $ = function (id) { return document.getElementById(id); };
  var lastPayload = (function () { try { return JSON.parse(sessionStorage.getItem('dsa_payload') || 'null'); } catch (e) { return null; } })();
  var jobId = null, pollTimer = null, failStreak = 0, lastView = 'form', firstName = '';

  function tt(k) { return T[lang][k]; }
  function apply() {
    document.documentElement.lang = lang;
    var map = { t_badge: 'badge', t_h1: 'h1', t_sub: 'sub', t_name: 'name', t_email: 'email', t_web: 'web', t_task: 'task', t_opt: 'opt', t_mic: 'mic', t_consent: 'consent', t_contact: 'contact', t_priv: 'priv', t_local: 'local', t_quick: 'quick', t_done_h: 'done_h', t_fail_h: 'fail_h', t_fail_p: 'fail_p', t_wait_sub: 'wait_sub' };
    Object.keys(map).forEach(function (id) { var el = $(id); if (el) el.textContent = tt(map[id]); });
    $('go').textContent = tt('go'); $('retry').textContent = tt('retry'); $('cta').textContent = tt('cta'); $('net').textContent = tt('net');
    $('t_wait_h').textContent = tt('wait_h') + (firstName || '');
    $('aihint').textContent = tt('ai'); $('again').textContent = tt('again'); $('lang').textContent = lang === 'de' ? 'EN' : 'DE';
    var p = $('t_priv'); p.href = (CFG.privacyUrl && !/^CHANGE_ME/.test(CFG.privacyUrl) ? CFG.privacyUrl : BASE + '/privacy') + '#' + lang;
    $('cta').href = CFG.bookingUrl || '#';
    $('task').placeholder = tt('task_ph');
    buildSteps(window.__stage || 'queued');
  }
  function show(v) {
    lastView = v;
    ['form', 'wait', 'done', 'fail'].forEach(function (x) { $('v_' + x).classList.toggle('hide', x !== v); });
    window.scrollTo(0, 0);
  }
  var ORDER = ['queued', 'fetching', 'thinking', 'done'];
  function buildSteps(stage) {
    window.__stage = stage;
    var ul = $('steps'); ul.textContent = '';
    var idx = Math.max(0, ORDER.indexOf(stage));
    ORDER.forEach(function (s, i) {
      var li = document.createElement('li');
      li.className = i < idx || stage === 'done' ? 'ok' : (i === idx ? 'on' : '');
      var b = document.createElement('span'); b.className = 'b'; b.textContent = (i < idx || stage === 'done') ? '✓' : String(i + 1);
      var tx = document.createElement('span'); tx.textContent = tt('s_' + s);
      li.appendChild(b); li.appendChild(tx); ul.appendChild(li);
    });
  }
  function save(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  // The page runs in a sandboxed context (no localStorage), so the job id also lives in the URL hash.
  function persistJob(id) { save('dsa_job', id); save('dsa_job_at', id ? String(Date.now()) : null); try { history.replaceState(null, '', id ? '#j=' + id : location.pathname + location.search); } catch (e) {} }
  // A link with #j= always resumes; reopening the page only resumes a brief from the last 30 minutes, otherwise a fresh form.
  function loadJob() { var m = (location.hash || '').match(/j=([a-f0-9]{20})/); if (m) return m[1]; var at = Number(load('dsa_job_at') || 0); return at && Date.now() - at < 30 * 60 * 1000 ? load('dsa_job') : null; }

  function fetchJson(url, opts, timeoutMs) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs || 12000);
    opts = opts || {}; if (ctl) opts.signal = ctl.signal; opts.cache = 'no-store';
    return fetch(url, opts).then(function (r) {
      clearTimeout(to);
      return r.text().then(function (txt) { var j = null; try { j = JSON.parse(txt); } catch (e) {} return { status: r.status, json: j }; });
    }, function (e) { clearTimeout(to); throw e; });
  }

  function submit(payload, attempt) {
    attempt = attempt || 0;
    return fetchJson(BASE + '/submit', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(payload) }, 15000).then(function (r) {
      if (r.status === 202 || r.status === 200) { if (r.json && r.json.jobId) return r.json; throw new Error('bad-response'); }
      if (r.status === 400 && r.json && r.json.code) { var e = new Error('input'); e.code = r.json.code; throw e; }
      if (r.status === 429) { var e2 = new Error('rate'); e2.code = 'rate'; throw e2; }
      if (r.status === 503 && r.json && r.json.code === 'busy') { var e3 = new Error('busy'); e3.code = 'busy'; throw e3; }
      throw new Error('http' + r.status);
    }).catch(function (e) {
      if (e.code) throw e;
      if (attempt >= 4) throw e;
      $('err').textContent = tt('e_net');
      return new Promise(function (res) { setTimeout(res, 1500 * Math.pow(1.7, attempt)); }).then(function () { return submit(payload, attempt + 1); });
    });
  }

  function poll() {
    clearTimeout(pollTimer);
    if (!jobId) return;
    fetchJson(BASE + '/status?id=' + encodeURIComponent(jobId), {}, 10000).then(function (r) {
      failStreak = 0; $('net').style.display = 'none';
      if (r.status === 404 || !r.json || !r.json.ok) { if (r.status === 404) { persistJob(null); jobId = null; show('fail'); return; } throw new Error('bad'); }
      var s = r.json;
      if (s.status === 'duplicate' && s.dupOf) { jobId = s.dupOf; persistJob(jobId); return schedule(300); }
      if (s.firstName && !firstName) { firstName = s.firstName; apply(); }
      if (s.status === 'done') { renderDone(s); return; }
      show('wait');
      buildSteps(s.status === 'queued' ? 'queued' : (s.stage || 'fetching'));
      $('queue').textContent = s.status === 'queued' ? tt('pos')(s.position || 1, s.etaSec || 20) : tt('working');
      schedule(2000);
    }).catch(function () {
      failStreak++;
      if (failStreak >= 2) $('net').style.display = 'block';
      schedule(Math.min(10000, 1500 * Math.pow(1.4, failStreak)));
    });
  }
  function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function renderDone(s) {
    var b = s.brief || {};
    $('summary').textContent = ''; $('opps').textContent = '';
    if (s.task && !b.generic) { var tk = el('p', 'note'); tk.appendChild(el('b', null, tt('your_task'))); tk.appendChild(document.createTextNode(lang === 'de' ? '„' + s.task + '“' : '"' + s.task + '"')); $('summary').appendChild(tk); }
    $('summary').appendChild(el('p', null, b.company_summary || ''));
    if (b.source === 'wikipedia' && !b.generic) $('summary').appendChild(el('p', 'note', tt('wiki')));
    (b.opportunities || []).forEach(function (o, i) {
      var d = el('div', 'opp'); var h = el('h3', null, (i + 1) + '. ' + (o.title || ''));
      d.appendChild(h);
      var dev = o.device || (o.on_device ? 'phone' : 'laptop'), ai = o.ai || (o.on_device ? 'on-device' : 'cloud');
      var tags = el('div', 'tags');
      tags.appendChild(el('span', 'tag', tt(dev === 'both' ? 'd_both' : dev === 'phone' ? 'd_phone' : 'd_laptop')));
      tags.appendChild(el('span', 'tag', tt(ai === 'hybrid' ? 'a_hybrid' : ai === 'on-device' ? 'a_on' : 'a_cloud')));
      d.appendChild(tags);
      var p1 = el('p'); p1.appendChild(el('b', null, tt('why') + ': ')); p1.appendChild(document.createTextNode(o.today || o.why || '')); d.appendChild(p1);
      var after = o.after || o.how;
      if (after) { var p2 = el('p'); p2.appendChild(el('b', null, tt('how') + ': ')); p2.appendChild(document.createTextNode(after)); d.appendChild(p2); }
      if (o.ai_reason) d.appendChild(el('p', 'note', tt('ai_why') + ': ' + o.ai_reason));
      $('opps').appendChild(d);
    });
    $('quick').textContent = b.quick_win || '';
    $('generic').textContent = tt('generic'); $('generic').classList.toggle('hide', !(b.generic || s.mode === 'fallback') || !!s.canRedo);
    $('t_redo_h').textContent = tt('redo_h'); $('t_redo_p').textContent = tt('redo_p'); $('redo_go').textContent = tt('redo_go');
    $('redo').classList.toggle('hide', !(s.canRedo && lastPayload));
    var m = s.emailStatus;
    $('mailnote').textContent = m === 'sent' ? tt('mail_sent') + ($('email').value || '') : (m === 'failed' || m === 'gave-up' ? tt('mail_failed') : tt('mail_wait'));
    show('done');
    if (m !== 'sent' && m !== 'gave-up') { /* refresh the mail line once more later */ setTimeout(function () { if (!jobId) return; fetchJson(BASE + '/status?id=' + encodeURIComponent(jobId), {}, 8000).then(function (r) { if (r.json && r.json.ok && r.json.emailStatus === 'sent') $('mailnote').textContent = tt('mail_sent') + ($('email').value || ''); }, function () {}); }, 12000); }
  }

  function validate() {
    var name = $('name').value.trim(), email = $('email').value.trim(), web = $('website').value.trim();
    if (name.length < 2) return 'e_name';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return 'e_email';
    if (!/^(https?:\/\/)?[^\s\/]+\.[^\s\/.]{2,}(\/.*)?$/i.test(web)) return 'e_website';
    if (!$('consent').checked) return 'e_consent';
    return '';
  }
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var bad = validate(); $('err').textContent = bad ? tt(bad) : '';
    if (bad) return;
    $('go').disabled = true; firstName = $('name').value.trim().split(/\s+/)[0] || '';
    var payload = { name: $('name').value, email: $('email').value, website: $('website').value, task: $('task').value, consent: true, contact: $('contact').checked, hp: $('hp').value, lang: lang };
    lastPayload = payload; try { sessionStorage.setItem('dsa_payload', JSON.stringify(payload)); } catch (e) {}
    submit(payload).then(function (j) {
      jobId = j.jobId; persistJob(jobId); save('dsa_email', $('email').value);
      apply(); show('wait'); buildSteps('queued');
      $('queue').textContent = tt('pos')(j.position || 1, j.etaSec || 20);
      schedule(800);
    }).catch(function (e) {
      $('go').disabled = false;
      var map = { name: 'e_name', email: 'e_email', website: 'e_website', consent: 'e_consent', rate: 'e_rate', busy: 'e_busy' };
      var k = e && e.code && map[e.code] ? map[e.code] : 'e_generic';
      $('err').textContent = tt(k);
    });
  });
  $('redo_go').addEventListener('click', function () {
    var t = $('redo_blurb').value.trim();
    if (t.length < 10) { $('redo_err').textContent = tt('redo_short'); return; }
    if (!lastPayload) return;
    $('redo_go').disabled = true; $('redo_err').textContent = '';
    var p = Object.assign({}, lastPayload, { blurb: t, lang: lang });
    submit(p).then(function (j) {
      jobId = j.jobId; persistJob(jobId); show('wait'); buildSteps('queued');
      $('queue').textContent = tt('pos')(j.position || 1, j.etaSec || 20); schedule(800); $('redo_go').disabled = false;
    }).catch(function () { $('redo_go').disabled = false; $('redo_err').textContent = tt('e_generic'); });
  });
  $('lang').addEventListener('click', function () { lang = lang === 'de' ? 'en' : 'de'; save('dsa_lang', lang); apply(); });
  $('again').addEventListener('click', function () {   // new brief for another company: keep name + email, ask for website and consent again
    clearTimeout(pollTimer); persistJob(null); jobId = null; lastPayload = null;
    try { sessionStorage.removeItem('dsa_payload'); } catch (e) {}
    $('website').value = ''; $('task').value = ''; $('consent').checked = false; $('contact').checked = false; $('err').textContent = ''; $('go').disabled = false;
    show('form'); try { $('website').focus(); } catch (e) {}
  });
  $('retry').addEventListener('click', function () { $('go').disabled = false; show('form'); });
  window.addEventListener('online', function () { if (jobId) schedule(100); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && jobId) schedule(100); });

  apply();
  var saved = loadJob(); var em = load('dsa_email');
  if (em) $('email').value = em;
  if (saved && /^[a-f0-9]{20}$/.test(saved)) { jobId = saved; show('wait'); buildSteps('queued'); schedule(100); } else { show('form'); }
})();
</script>
